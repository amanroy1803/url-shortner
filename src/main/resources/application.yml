spring:
  application:
    name: url-shortener

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      data-source-properties:
        sslmode: require

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

  db:
    shard-count: 1
    shard0:
      primary-url: ${DB_URL}
      replica-url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}

  snowflake:
    node-id: 0

  cache:
    url-ttl-hours: 24
    click-count-ttl-hours: 168

  redis:
    eviction-policy: volatile-lfu
    max-memory: 256mb

  rate-limit:
    capacity: 200
    refill-rate: 100
    window-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.urlshortener: DEBUG
